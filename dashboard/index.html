<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin</title>
  <link rel="stylesheet" href="../css/admin.css">
  <script type="module" src="../js/admin.js" defer></script>
</head>
<body>
<section class="upload-berita">
  <h2>Tambah Berita Baru</h2>
  <form id="formBerita">
    <label>Judul Berita:</label><br>
    <input type="text" id="judul" required><br><br>

    <label>Isi Berita:</label><br>
    <textarea id="isi" rows="5" required></textarea><br><br>

    <button type="submit">Upload Berita</button>
  </form>
</section>

<script type="module" src="../js/berita.js"></script>
  <header>
    <h1>Dashboard Admin</h1>
    <button id="logout-btn">Logout</button>
  </header>

  <main class="dashboard">
    <section>
      <h2>Kelola Berita</h2>
      <form id="news-form">
        <input type="text" id="judul" placeholder="Judul Berita" required>
        <textarea id="isi" placeholder="Isi Berita" required></textarea>
        <button type="submit">Tambah / Update Berita</button>
      </form>
      <div id="news-list"></div>
    </section>

    <section>
      <h2>Pesan Masuk</h2>
      <div id="pesan-list"></div>
    </section>
  </main>
</body>
</html>
